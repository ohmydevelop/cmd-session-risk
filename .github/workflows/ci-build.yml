name: build-cmdrisk-single
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build single binary
        run: make -f Makefile.release all
      - name: Smoke test
        run: make -f Makefile.release smoke
      - name: Export binary
        uses: actions/upload-artifact@v4
        with:
          name: cmdrisk-linux-x64
          path: build/cmdrisk
